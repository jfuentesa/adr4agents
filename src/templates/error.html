{% extends 'base.html' %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}<section class="card error-page">
<p class="eyebrow">ERROR {{ status }}</p>
<h1>{{ 'Page not found' if status == 404 else 'Unable to complete this request' }}</h1>
<p class="prose" role="alert">{{ message }}</p>
<a class="button primary" href="{{ url_for('web.decision_list') }}">Back to decisions</a>
</section>{% endblock %}
